name: CI/CD

on:
  push:
    branches: [ main, dude2 ]
  pull_request:
    branches: [ main ]

# propose-vps-update runs independently on BOTH main and dude2:
# main pushes bump the `dude` input, dude2 pushes bump the `dude2` input
# (dude2 lives on its own branch until we're ready to cut over fully).
jobs:
  propose-vps-update:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dude2')
    env:
      DUDE_INPUT_NAME: ${{ github.ref == 'refs/heads/main' && 'dude' || 'dude2' }}
      DUDE_BRANCH_NAME: ${{ github.ref == 'refs/heads/main' && 'dude' || 'dude2' }}
    steps:
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GH_TOKEN: "op://dude GHA SA/dudeagent-github-pat/token"

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: make branch + update + commit + push
        run: |
          gh repo clone johndikeman/dotfiles 
          cd dotfiles 
          git checkout vps_nix 
          git checkout -b update-${DUDE_BRANCH_NAME}-${{github.sha}} 
          nix flake update $DUDE_INPUT_NAME 
          git add flake.lock 
          git config --global user.email "dude@johnf.art"
          git config --global user.name "dude"
          # when the lock is already current (e.g. the PR branch bumped it and
          # CI ran again on the merge push), there's nothing to commit — exit
          # cleanly instead of failing the whole run (seen 2026-09-28 #80/#81)
          if git diff --cached --quiet; then
            echo "flake.lock already current; nothing to update"
            exit 0
          fi
          git commit -m "chore: update $DUDE_INPUT_NAME to ${{github.sha}}" 
          gh auth setup-git
          git push origin update-${DUDE_BRANCH_NAME}-${{github.sha}}
      - name: open pr
        run: |
          cd dotfiles
          gh pr create -B vps_nix --fill --assignee johndikeman
